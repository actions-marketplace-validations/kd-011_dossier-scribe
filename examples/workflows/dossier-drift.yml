# Nightly drift check. Opens or updates one issue per drifted dossier, and closes
# the issue once the dossier is clean again. Needs the lock file committed.
#
# Until the package is published, install from a git URL instead of npm:
#   npm install -g github:OWNER/dossier-scribe
name: dossier drift

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g github:kd-011/dossier-scribe  # switch to the npm name once it is published

      - name: Lint and auto block
        run: |
          dossier-scribe lint
          dossier-scribe auto --check

      - name: Check drift and write one task per drifted dossier
        run: |
          dossier-scribe check --json > drift.json || true
          dossier-scribe queue --out tasks --cooldown 0 --max 100 || true

      - name: Open, update and close issues
        run: |
          gh label create dossier-drift --color BFD4F2 2>/dev/null || true
          drifted=$(jq -r '.docs[] | select(.error == null and (.summary.stale + .summary.broken) > 0) | .slug' drift.json)

          for slug in $drifted; do
            title="Dossier drift: $slug"
            number=$(gh issue list --label dossier-drift --state open --search "\"$title\" in:title" --json number,title \
              --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "tasks/$slug.md"
            else
              gh issue create --title "$title" --label dossier-drift --body-file "tasks/$slug.md"
            fi
          done

          # Close issues for dossiers that are clean now.
          gh issue list --label dossier-drift --state open --json number,title --jq '.[] | "\(.number)\t\(.title)"' |
            while IFS=$'\t' read -r number title; do
              slug=${title#Dossier drift: }
              if ! printf '%s\n' $drifted | grep -qx "$slug"; then
                gh issue close "$number" --comment "No drifted claims in $slug any more."
              fi
            done

      - name: Fail the run when anything drifted
        run: dossier-scribe check --fail-on stale,broken
